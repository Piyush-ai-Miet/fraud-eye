<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Face Recognition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        .eye-logo {
            position: relative;
            width: 120px;
            height: 80px;
            margin: 0 auto 30px;
        }
        
        .eye-outer {
            position: absolute;
            width: 120px;
            height: 60px;
            border: 4px solid #667eea;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            top: 10px;
        }
        
        .eye-iris {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #667eea 0%, #764ba2 70%, #000 100%);
            border-radius: 50%;
            top: 15px;
            left: 35px;
            animation: eyeScan 2s infinite;
        }
        
        .eye-pupil {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #000;
            border-radius: 50%;
            top: 15px;
            left: 15px;
        }
        
        @keyframes eyeScan {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        #webcam {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .face-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 250px;
            border: 3px solid #667eea;
            border-radius: 50%;
            pointer-events: none;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        }
        
        .status {
            padding: 15px;
            border-radius: 15px;
            margin: 20px 0;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .status.scanning {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 10px;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .instructions {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: left;
        }
        
        .instructions h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .instructions ul {
            margin-left: 20px;
            color: #666;
        }
        
        .instructions li {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Eye Logo -->
        <div class="eye-logo">
            <div class="eye-outer">
                <div class="eye-iris">
                    <div class="eye-pupil"></div>
                </div>
            </div>
        </div>
        
        <h1>🛡️ Admin Login</h1>
        <p class="subtitle">Face Recognition Authentication</p>
        
        <!-- Webcam Video -->
        <div class="video-container" id="videoContainer" style="display: none;">
            <video id="webcam" autoplay playsinline></video>
            <div class="face-overlay"></div>
        </div>
        
        <!-- Status Messages -->
        <div id="status" class="status scanning" style="display: none;">
            📸 Scanning your face...
        </div>
        
        <!-- Buttons -->
        <button class="btn" id="startBtn" onclick="startFaceRecognition()">
            📷 Start Face Recognition
        </button>
        
        <button class="btn" id="captureBtn" onclick="captureAndVerify()" style="display: none;">
            ✅ Verify Face
        </button>
        
        <!-- Instructions -->
        <div class="instructions">
            <h3>📋 Instructions:</h3>
            <ul>
                <li>Click "Start Face Recognition"</li>
                <li>Allow camera access</li>
                <li>Position your face in the oval</li>
                <li>Click "Verify Face" to login</li>
                <li>Good lighting required</li>
            </ul>
        </div>
    </div>
    
    <script>
        let stream = null;
        let videoElement = null;
        
        async function startFaceRecognition() {
            try {
                document.getElementById('status').style.display = 'block';
                document.getElementById('status').className = 'status scanning';
                document.getElementById('status').textContent = '📸 Starting camera...';
                
                // Request camera access
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 },
                        facingMode: 'user'
                    } 
                });
                
                videoElement = document.getElementById('webcam');
                videoElement.srcObject = stream;
                
                document.getElementById('videoContainer').style.display = 'block';
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('captureBtn').style.display = 'inline-block';
                
                document.getElementById('status').className = 'status scanning';
                document.getElementById('status').textContent = '👤 Position your face in the oval';
                
            } catch (error) {
                console.error('Camera error:', error);
                document.getElementById('status').className = 'status error';
                document.getElementById('status').textContent = '❌ Camera access denied. Please allow camera permission.';
            }
        }
        
        async function captureAndVerify() {
            try {
                document.getElementById('status').className = 'status scanning';
                document.getElementById('status').textContent = '🔍 Verifying face...';
                document.getElementById('captureBtn').disabled = true;
                
                // Capture image from video
                const canvas = document.createElement('canvas');
                canvas.width = videoElement.videoWidth;
                canvas.height = videoElement.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoElement, 0, 0);
                
                // Convert to blob
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
                
                // Send to server for verification
                const formData = new FormData();
                formData.append('face_image', blob, 'face.jpg');
                
                const response = await fetch('/api/admin/verify-face', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.verified) {
                    document.getElementById('status').className = 'status success';
                    document.getElementById('status').textContent = '✅ Face verified! Redirecting...';
                    
                    // Store session token
                    localStorage.setItem('admin_token', result.token);
                    
                    // Stop camera
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                    }
                    
                    // Redirect to admin dashboard
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 1500);
                } else {
                    document.getElementById('status').className = 'status error';
                    document.getElementById('status').textContent = '❌ Face not recognized. Try again.';
                    document.getElementById('captureBtn').disabled = false;
                }
                
            } catch (error) {
                console.error('Verification error:', error);
                document.getElementById('status').className = 'status error';
                document.getElementById('status').textContent = '❌ Verification failed. Try again.';
                document.getElementById('captureBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
