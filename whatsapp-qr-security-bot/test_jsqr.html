<!DOCTYPE html>
<html>
<head>
    <title>Test jsQR</title>
</head>
<body>
    <h1>Test JavaScript QR Scanner</h1>
    <input type="file" id="qrInput" accept="image/*">
    <div id="result"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        document.getElementById('qrInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    
                    if (code) {
                        document.getElementById('result').innerHTML = 
                            '<h2>✅ QR Code Detected!</h2><p>' + code.data + '</p>';
                    } else {
                        document.getElementById('result').innerHTML = 
                            '<h2>❌ QR Code Not Found</h2>';
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
